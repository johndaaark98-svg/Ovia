# OVIA — pubblica un articolo al giorno sul blog, in automatico.
# Richiede un solo secret: ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Blog giornaliero

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Pubblica anche se oggi c’è già un articolo'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-giornaliero
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Genera l’articolo di oggi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR }}
        run: node scripts/blog/genera.mjs ${{ inputs.force && '--force' || '' }}

      - name: Pubblica sul sito
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nessuna modifica da pubblicare."; exit 0
          fi
          git config user.name "Ovia Blog Bot"
          git config user.email "oviaitalia@gmail.com"
          git add -A content blog sitemap.xml llms.txt servizi
          git commit -m "blog: articolo del $(TZ=Europe/Rome date +%Y-%m-%d)"
          git pull --rebase
          git push
